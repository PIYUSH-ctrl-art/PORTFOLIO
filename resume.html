<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESUME | PIYUSH DAS</title>
<style>
    /* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Heading */

h1{
    font-size:42px;
    color:#00d4ff;
    margin-bottom:15px;
    letter-spacing:2px;
}

h1::after{
    content:"";
    display:block;
    width:130px;
    height:4px;
    background:#00d4ff;
    margin:12px auto 0;
    border-radius:10px;
}

/* Resume Viewer */

.resume-frame{
    width:90%;
    max-width:1000px;
    height:800px;
    border:none;
    border-radius:18px;
    background:white;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    transition:.4s;
    overflow:hidden;
}

.resume-frame:hover{
    transform:translateY(-6px);
    box-shadow:0 20px 50px rgba(0,212,255,.30);
}

/* Download Button */

a{
    margin-top:30px;
    text-decoration:none;
    color:white;
    background:#00d4ff;
    padding:14px 35px;
    border-radius:10px;
    font-size:18px;
    font-weight:600;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,212,255,.35);
}

a:hover{
    background:#0099cc;
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(0,212,255,.5);
}

/* Scrollbar */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#0f172a;
}

::-webkit-scrollbar-thumb{
    background:#00d4ff;
    border-radius:20px;
}

/* Responsive */

@media(max-width:768px){

    h1{
        font-size:34px;
    }

    .resume-frame{
        width:100%;
        height:600px;
    }

    a{
        font-size:16px;
        padding:12px 28px;
    }

}

@media(max-width:480px){

    body{
        padding:20px;
    }

    h1{
        font-size:28px;
    }

    .resume-frame{
        height:450px;
    }

}
      /* RESUME IMAGE */

        .resume_img {
    display: block;
    width: 85%;
    max-width: 600px;
    height: auto;
    margin: 40px auto;
    border: 3px solid #35c4e8;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(53, 196, 232, 0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
} 

        .resume_img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .resume_img:hover {
            transform: scale(1.015);
            box-shadow: 0 0 30px rgba(53, 196, 232, 0.45);
        }

        @media (max-width: 768px) {
            .resume_img {
                width: 92%;
                margin: 25px auto;
                border-width: 2px;
            }
        }
</style>
</head> 

<body>
